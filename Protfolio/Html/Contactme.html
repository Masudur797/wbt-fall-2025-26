  <h3>Contact Form</h3>

  
  <form method="GET">

    <div class="row">
      <label>First Name:</label>
      <input type="text" name="firstname" required>
    </div>

    <div class="row">
      <label>Last Name:</label>
      <input type="text" name="lastname" required>
    </div>

    <div class="row">
      <label>Email:</label>
      <input type="email" name="email" required>
    </div>

    <div class="row">
      <label>Phone:</label>
      <input type="text" name="phone">
    </div>

    <div class="row">
      <label>Company:</label>
      <input type="text" name="company">
    </div>

    <div class="row">
      <label>Preferred Date:</label>
      <input type="date" name="contactdate">
    </div>

    <br>
    <b>Reason for Contact:</b><br><br>

   
    <input type="radio" name="reason" value="Project" required> Project<br>
    <select name="project">
      <option>Database System</option>
      <option>Portfolio Website</option>
      <option>Super Shop Management</option>
    </select>
    <br><br>

    
    <input type="radio" name="reason" value="Thesis"> Thesis<br>
    <select name="thesis">
      <option>Solar Management System</option>
      <option>App Development Benefit</option>
      <option>Cloud Security Framework</option>
    </select>
    <br><br>

    
    <input type="radio" name="reason" value="Job"> Job<br>
    <select name="job">
      <option>Pran Company Engineering</option>
      <option>My Dream797 IT Sector</option>
      <option>Apple Company</option>
    </select>
    <br><br>

    Book an Appointment:<br>
    <input type="date" name="appointment"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

  </form>
